[project]
name = "content-ranking-mlops"
version = "0.1.0"
requires-python = ">=3.13.9,<3.14"
dependencies = [
    "duckdb==1.5.4",
    "lightgbm==4.7.0",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
